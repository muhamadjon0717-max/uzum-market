
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Uzum Market{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f7;
            color: #222;
        }
        header {
            background: white;
            padding: 18px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            box-shadow: 0 2px 10px #0000000b;
        }
        .logo {
            font-size: 29px;
            font-weight: 900;
            color: #7000ff;
            text-decoration: none;
        }
        .search {
            display: flex;
            flex: 1;
            max-width: 550px;
        }
        .search input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px 0 0 10px;
            outline: none;
        }
        button, .btn {
            border: none;
            background: #7000ff;
            color: white;
            padding: 12px 18px;
            border-radius: 9px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }
        button:hover, .btn:hover { background: #5800cc; }
        .add-btn { background: #7000ff; }
        .container { width: 90%; max-width: 1400px; margin: 30px auto; }
        .categories {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .categories a {
            padding: 10px 18px;
            border-radius: 20px;
            text-decoration: none;
            color: #333;
            background: white;
        }
        .categories a:hover { background: #7000ff; color: white; }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 22px;
        }
        .product {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            padding: 12px;
            box-shadow: 0 3px 15px #00000008;
            transition: .2s;
        }
        .product:hover { transform: translateY(-5px); }
        .product img {
            width: 100%;
            height: 210px;
            object-fit: contain;
            border-radius: 12px;
            background: #fafafa;
        }
        .product h3 { font-size: 17px; min-height: 40px; }
        .price { font-size: 21px; font-weight: bold; color: #222; }
        .actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
        .actions a, .actions button { font-size: 12px; padding: 9px; }
        .edit { background: #333; }
        .delete { background: #e53935; }
        .cart-btn { background: #ff8a00; }
        .form-box {
            background: white;
            max-width: 600px;
            margin: 35px auto;
            padding: 30px;
            border-radius: 18px;
        }
        .form-box input, .form-box textarea {
            width: 100%;
            padding: 13px;
            margin: 10px 0 18px;
            border: 1px solid #ddd;
            border-radius: 9px;
        }
        .form-box label { font-weight: bold; }
        footer {
            background: #24202d;
            color: white;
            text-align: center;
            padding: 30px;
            margin-top: 60px;
        }
        @media(max-width:600px) {
            header { padding: 15px; }
            .container { width: 94%; }
        }
    </style>
</head>
<body>

<header>
    <a class="logo" href="/">uzum market</a>

    <form class="search" action="/" method="get">
        <input name="q" placeholder="Товары, бренды и категории..." value="{{ search|default:'' }}">
        <button type="submit">Найти</button>
    </form>

    <a class="btn" href="{% url 'cart' %}">🛒 Корзина</a>
    <a class="btn add-btn" href="{% url 'add_product' %}">+ Добавить</a>
</header>

{% block content %}{% endblock %}

<footer>
    <h2>Uzum Market</h2>
    <p>Покупки с удовольствием 💜</p>
    <p>Учебный проект на Django</p>
</footer>

</body>
</html>
